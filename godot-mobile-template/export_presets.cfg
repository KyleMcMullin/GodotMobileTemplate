; ============================================================================
; export_presets.cfg - PLACEHOLDER STARTER. Regenerate this from the editor.
; ============================================================================
;
; This file is NOT a working export configuration. It exists to document where the
; keystore placeholder tokens go, so a fresh game from this template has something
; to read before its first export is configured.
;
; TO MAKE IT REAL:
;   1. Open the project in Godot.
;   2. Project > Export... > Add... > Android. Configure it.
;   3. Add... > iOS if you are shipping iOS.
;   4. Close the dialog. Godot OVERWRITES this file with the real config.
;   5. Re-add the three keystore placeholder lines below if you want the sed path
;      (see "Signing" further down for why they are optional).
;
; Do not hand-write the real thing. It runs to several hundred keys and the exact
; set varies with the Godot version, editor settings, and which addons are enabled.
; Godot rewrites the file every time the export dialog is opened, so invented keys
; are silently dropped.
;
; Full explanation, with a real annotated Godot 4.7 preset:
;   https://github.com/KyleMcMullin/godot-ci/blob/main/export_presets.cfg.annotated-example
; ============================================================================


[preset.0]

; This string is the android-preset-name input in .github/workflows/ci.yml.
; Keep the two in sync, case-sensitive.
name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="*.import"

; The workflow passes an explicit output path, which wins. Safe to leave empty.
export_path=""

encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

; --- Signing -----------------------------------------------------------------
; NEVER put real keystore values here. CI substitutes these tokens with values
; decoded from the ANDROID_KEYSTORE_* secrets.
;
; These three lines are OPTIONAL. Godot only writes keystore/release* into this
; file if you type real values into the export dialog - which you should not do.
; If they are absent, CI falls back to Godot's GODOT_ANDROID_KEYSTORE_RELEASE_*
; environment variables, which work the same way. Both paths are supported.
keystore/release="__ANDROID_KEYSTORE_PATH__"
keystore/release_user="__ANDROID_KEYSTORE_USER__"
keystore/release_password="__ANDROID_KEYSTORE_PASSWORD__"

; Required, or Play rejects the upload as unsigned.
package/signed=true

; --- Build type --------------------------------------------------------------
; 0 = APK, 1 = AAB. Google Play requires AAB for new apps.
gradle_build/export_format=1

; This template ships AdMob, Play Billing and Play Games Services, all of which are
; native Android plugins - so Gradle builds are mandatory, not optional. CI installs
; a JDK and the Android SDK and runs --install-android-build-template because of this.
gradle_build/use_gradle_build=true
gradle_build/min_sdk=""
gradle_build/target_sdk="35"

; --- Identity ----------------------------------------------------------------
; CHANGE ME. Must match android-package-name in ci.yml and the Play Console
; listing. Play fixes this on first upload and it can never be changed afterwards.
package/unique_name="com.example.mygame"
package/name="My Game"

; Local export defaults. The currently published shared Actions workflow bumps
; version/code on deployment. Keep version/name in sync with config/version and
; version.json when you change the marketing version. The split-runner allocator
; and apply-version.sh are not published upstream yet.
version/code=1
version/name="1.0.0"

architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false

permissions/internet=true

; Enabled native plugins show up here, e.g.:
; plugins/AdMob=true


[preset.1]

; This string is the ios-preset-name input in ci.yml.
name="iOS"
platform="iOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="*.import"
export_path=""

[preset.1.options]

; CHANGE ME. Must match ios-bundle-id in ci.yml and the registered App ID.
application/bundle_identifier="com.example.mygame"
application/signature=""
; Local export defaults. Set the marketing version and a fresh iOS build number
; before enabling iOS deployment; the published workflow does not allocate it.
application/short_version="1.0.0"
application/version="1"

; Leave signing EMPTY. Godot's iOS export only emits an Xcode project - it signs
; nothing. Signing happens in fastlane using the certificates match provides.
; Values here are ignored at best and cause identity conflicts at worst.
application/provisioning_profile_uuid_release=""
application/code_sign_identity_release=""
application/export_method_release=0

application/targeted_device_family=2
application/min_ios_version="12.0"
