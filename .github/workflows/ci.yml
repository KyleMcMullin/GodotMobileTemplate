name: CI

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Template checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Cache Godot
        id: godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-4.7.1-linux
      - name: Download Godot
        if: steps.godot.outputs.cache-hit != 'true'
        env:
          GODOT_VERSION: '4.7.1'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
      - name: Run fresh import and template regression checks
        env:
          GODOT_BIN: /home/runner/godot-bin/godot
        run: ./run_tests.sh

  # Enable only in a configured game repository, after completing godot-ci/SETUP.md.
  # These are repository variables (Settings > Secrets and variables > Actions).
  # The default template has no store accounts or signing secrets and only runs tests.
  release:
    needs: test
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      (vars.ENABLE_ANDROID_DEPLOYMENT == 'true' || vars.ENABLE_IOS_DEPLOYMENT == 'true')
    permissions:
      contents: write
    # Uses only inputs accepted by the published shared workflow. The CircleCI
    # runner/allocation inputs are still unpublished upstream; see README.
    uses: KyleMcMullin/godot-ci/.github/workflows/godot-ci.yml@main
    secrets: inherit
    with:
      godot-version: '4.7.1'
      project-path: 'godot-mobile-template'
      android-preset-name: 'Android'
      ios-preset-name: 'iOS'
      # CHANGE ME: match the export presets and registered store listings.
      android-package-name: 'com.example.mygame'
      ios-bundle-id: 'com.example.mygame'
      ios-team-id: ''
      enable-android: ${{ vars.ENABLE_ANDROID_DEPLOYMENT == 'true' }}
      enable-ios: ${{ vars.ENABLE_IOS_DEPLOYMENT == 'true' }}
      deploy: true
